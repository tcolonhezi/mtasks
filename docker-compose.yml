services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mtasks-api:latest
    container_name: mtasks-api
    ports:
      - "3333:3333"
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy 

  postgres:
    image: bitnami/postgresql:latest
    container_name: postgres_mtasks
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgresql
      - POSTGRESQL_DATABASE=mtask
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mtask"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/bitnami/postgresql

volumes:
  postgres_data: